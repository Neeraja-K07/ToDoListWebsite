<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Kawaii To-Do!</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='resetpasswordstyle.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Cherry+Bomb+One&family=Open+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="auth-page-body">
    <div class="auth-container">
        <header class="auth-header">
            <h1>Reset Your Password🔑</h1>
        </header>

        <main class="auth-main">
            <div id="reset-password-section" class="auth-section active">
                <p class="reset-intro">No worries, we'll help you get back to your tasks!</p>
                <form class="auth-form">
                    <div class="input-group">
                        <label for="reset-username">Username</label>
                        <input type="text" id="reset-username" placeholder="Enter your username" required>
                    </div>
                    <div class="input-group">
                        <label for="new-password">New Password</label>
                        <input type="password" id="new-password" placeholder="Create your new password" required>
                    </div>
                    <div class="input-group">
                        <label for="confirm-new-password">Confirm New Password</label>
                        <input type="password" id="confirm-new-password" placeholder="Retype new password" required>
                    </div>
                    <button type="submit" class="auth-submit-button reset-submit-button">Reset Password</button>
                </form>
            </div>
        </main>
        <p class="back-link-wrapper">
            <!-- <a href="auth.html" class="back-to-home-link"><i class="fas fa-arrow-left"></i> Back to Login</a> -->
            <a href="{{ url_for('show_auth') }}" class="back-to-home-link"><i class="fas fa-arrow-left"></i> Back to Login</a>


        </p>
    </div>
</body>
</html>
